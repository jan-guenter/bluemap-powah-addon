name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable v* tag to release or resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'

      - name: Build and verify accepted bytes
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication
          test "$(stat -c %s \
            "build/libs/bluemap-powah-addon-${VERSION}-sources.jar")" \
            -eq 17738
          test "$(stat -c %s build/publications/addon/pom-default.xml)" \
            -eq 1371
          test "$(stat -c %s build/publications/addon/module.json)" \
            -eq 2803
          sha256sum --check <<SHA256SUMS
          0b370dfcd5d8c0a5844dd920d60a2cdb74ed441d87ff038382d8292c374686c8  build/libs/bluemap-powah-addon-${VERSION}.jar
          0bb0f1b4de0afa236239df2f17e61dd539417c4b8c40228ccd4ee433dffbd9b6  build/libs/bluemap-powah-addon-${VERSION}-sources.jar
          be150f0dea9cf4a738ae946b33066fc7050b9a5cb15f1f86ab2e5fc9c36884c9  build/publications/addon/pom-default.xml
          afc8631708e03d7df5b3841363270e95137e2654deaada498199232228a247b9  build/publications/addon/module.json
          SHA256SUMS

      - name: Prepare release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-powah-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-powah-addon-${VERSION}-sources.jar" release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-powah-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-powah-addon-${VERSION}.module.json"
          (cd release && sha256sum -- ./* > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)
          test "$(stat -c %s release/SHA256SUMS)" -eq 440
          test "$(sha256sum release/SHA256SUMS | cut -d ' ' -f 1)" = \
            7fa06c2f032a05c57d37eaec1ccd4d73997446fc4aa7f618b406a4c9aca6bbc4

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft \
              --prerelease \
              --generate-notes \
              --title "BlueMap Powah Add-on ${VERSION}" \
              --verify-tag
          fi

      - name: Attest release JARs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.jar

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
