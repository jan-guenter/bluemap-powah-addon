name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate migration candidate
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication \
            verifyAcceptedProductionJar

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-powah-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
